<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">RF Equipment 8-DUT Wi-Fi calibration station</title>
<desc id="desc">Production RF calibration station with RF equipment, network switch, PC, monitor and eight independent RF shield boxes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef4f8"/><stop offset="1" stop-color="#dbe5ec"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfc"/><stop offset=".45" stop-color="#dfe5e9"/><stop offset="1" stop-color="#b9c3ca"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#092a5c"/><stop offset="1" stop-color="#0a4b8f"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061a3a" flood-opacity=".18"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
